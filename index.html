<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab Check">
<title>TOEIC 單字自測</title>
<style>
:root{
  --bg:#101317; --panel:#171b21; --panel2:#1d222a; --line:#2a313b;
  --ink:#e9edf2; --dim:#8a94a2; --faint:#5b6572;
  --measure:#f0b429; --pass:#3ddc97; --fail:#ff5f56; --ipa:#c9a37a;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Consolas,monospace;
  --cjk:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--cjk);-webkit-font-smoothing:antialiased}
body{padding:0 16px 40px;min-height:100vh}
.wrap{max-width:820px;margin:0 auto}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--measure);outline-offset:2px}

.top{display:flex;align-items:baseline;gap:10px;padding:18px 2px 14px;
  border-bottom:1px solid var(--line);margin-bottom:22px}
.top .name{font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.top .sub{font-size:12px;color:var(--faint)}
.top .right{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}

h2{font-size:13px;letter-spacing:.1em;color:var(--dim);margin:0 0 10px;
  font-weight:600;text-transform:uppercase;font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:16px;margin-bottom:18px}

/* ---- 模式 ---- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:3px;
  background:var(--panel2);transition:border-color .12s,background .12s}
.mode:hover{border-color:var(--faint)}
.mode.on{border-color:var(--measure);background:#221d13}
.mode .h{font-size:14px;font-weight:700;margin-bottom:3px}
.mode.on .h{color:var(--measure)}
.mode .d{font-size:11px;color:var(--faint);line-height:1.5}

/* ---- 天數 ---- */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tool{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--dim);
  border:1px solid var(--line);padding:5px 10px;border-radius:2px}
.tool:hover{color:var(--ink);border-color:var(--faint)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.day{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px 10px;
  border:1px solid var(--line);border-radius:2px;background:var(--panel2);
  transition:border-color .12s,background .12s}
.day:hover{border-color:var(--faint)}
.day.on{border-color:var(--measure);background:#221d13}
.day .n{font-family:var(--mono);font-size:11px;color:var(--dim);
  display:flex;justify-content:space-between}
.day.on .n{color:var(--measure)}
.day .t{font-size:12px;line-height:1.35;color:var(--ink)}

.rows{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row label{font-size:13px;color:var(--dim);min-width:96px}
input[type=number]{width:88px;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);font-family:var(--mono);font-size:14px;padding:7px 9px;border-radius:2px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--measure)}
.hint{font-size:12px;color:var(--faint);line-height:1.5}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.chk input{accent-color:var(--measure);width:15px;height:15px}
.go{width:100%;background:var(--measure);color:#15181c;font-weight:700;font-size:15px;
  padding:14px;border-radius:3px;letter-spacing:.04em;margin-top:4px}
.go:disabled{background:var(--panel2);color:var(--faint);cursor:not-allowed}

/* ---- 測驗 ---- */
.hud{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;
  color:var(--faint);margin-bottom:26px;letter-spacing:.06em}
.hud .ct{color:var(--dim)}
.spark{margin-left:auto;display:flex;align-items:flex-end;gap:2px;height:18px}
.spark i{width:3px;background:var(--faint);border-radius:1px;display:block}
.spark i.ov{background:var(--fail)}

.stage{text-align:center;padding:14px 0 4px}
.word{font-family:var(--mono);font-weight:600;letter-spacing:-.01em;
  font-size:clamp(30px,7.4vw,52px);line-height:1.1;word-break:break-word}

.gauge{margin:26px auto 0;max-width:460px}
.ticks{position:relative;height:7px;margin-bottom:5px}
.ticks i{position:absolute;top:0;width:1px;height:5px;background:var(--line)}
.track{position:relative;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:var(--measure);width:0}
.readout{display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px;letter-spacing:.06em}
.readout .val{color:var(--measure);font-size:13px}
.readout .val.ov{color:var(--fail)}

/* ---- 四選一：十字排列 ---- */
/* 十字（上／左右／下）：四顆一樣大，左右緊鄰中線 */
.mcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px auto 0;
  max-width:560px}
.opt{position:relative;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:15px 12px;border:1px solid var(--line);min-height:60px;
  border-radius:3px;background:var(--panel2);font-size:16px;line-height:1.4;
  transition:border-color .12s,background .12s}
.opt:hover:not(.done){border-color:var(--measure);color:var(--measure)}
.opt.o-top,.opt.o-bot{grid-column:1 / 3;justify-self:center;
  width:calc(50% - 5px)}
.opt.o-top{grid-row:1}
.opt.o-bot{grid-row:3}
.opt.onext{grid-area:3 / 2 / 4 / 3;justify-self:end;align-self:center;
  width:auto;min-width:84px;padding:15px 12px;font-size:14px;font-weight:600;
  color:var(--dim);background:var(--panel)}
.opt.onext:hover{border-color:var(--measure);color:var(--measure);background:var(--panel2)}
.opt.o-left {grid-area:2 / 1 / 3 / 2}
.opt.o-right{grid-area:2 / 2 / 3 / 3}
@media (max-width:560px){
  .mcgrid{gap:8px}
  .opt{font-size:15px;padding:13px 8px;min-height:56px}
  .opt.onext{min-width:64px;padding:13px 8px;font-size:13px}
  .opt.o-top,.opt.o-bot{width:calc(50% - 4px)}
}
.opt.right{border-color:var(--pass);background:#12241c;color:var(--pass)}
.opt.wrong{border-color:var(--fail);background:#251413;color:var(--fail)}
.opt.done{cursor:default}
.opt.dim{opacity:.42}

.ans{margin-top:24px;border-top:1px solid var(--line);padding-top:20px;text-align:left}
.ans .phline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ans .ph{font-family:var(--mono);font-size:14px;color:var(--ipa)}
.ans .ph .reg{font-family:var(--cjk);font-size:11px;color:var(--faint);margin-right:4px}
.spk{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:4px 8px}
.spk:hover:not(:disabled){color:var(--measure);border-color:var(--measure)}
.spk:disabled{opacity:.3;cursor:not-allowed}
.spk.on{color:var(--measure);border-color:var(--measure)}
.spk .lb{font-family:var(--cjk)}
.spk .k{opacity:.55;font-size:10px}
.ans .mean{font-size:21px;line-height:1.5;margin-bottom:16px}
.ans .mean .pos{color:var(--measure);font-weight:700;margin-right:2px}
.ans .ex{background:var(--panel);border-left:2px solid var(--line);padding:11px 14px;border-radius:2px}
.ans .ex .en{font-size:14px;line-height:1.55}
.ans .ex .zh{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.5}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.act{padding:15px;border-radius:3px;font-size:15px;font-weight:700;border:1px solid}
.act .k{display:block;font-family:var(--mono);font-size:10px;font-weight:400;
  opacity:.7;margin-top:3px;letter-spacing:.08em}
.act.ok{border-color:#256b50;background:#12241c;color:var(--pass)}
.act.ng{border-color:#7a3230;background:#251413;color:var(--fail)}
.act.ok:hover{background:#173124}.act.ng:hover{background:#2f1917}
.recall,.nextq{width:100%;padding:15px;border:1px solid var(--line);border-radius:3px;
  background:var(--panel2);font-size:15px;font-weight:600;margin-top:22px}
.recall:hover,.nextq:hover{border-color:var(--measure);color:var(--measure)}
.nextq .k{font-family:var(--mono);font-size:10px;font-weight:400;opacity:.6;margin-left:8px}
.quit{display:block;margin:20px auto 0;font-size:12px;color:var(--faint)}
.quit:hover{color:var(--dim)}

/* ---- 結果 ---- */
.score{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);margin-bottom:4px}
.score .big{font-size:56px;font-weight:700;line-height:1}
.score .pct{font-size:20px;color:var(--dim)}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;
  color:var(--faint);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.stats b{color:var(--ink);font-weight:600}
.wrongs{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:2px}
.wrongs .r{background:var(--panel);padding:9px 12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.wrongs .w{font-family:var(--mono);font-weight:600;font-size:14px;min-width:130px}
.wrongs .m{font-size:13px;color:var(--dim)}
.wrongs .pick{font-size:12px;color:var(--fail)}
.wrongs .ov{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--fail)}
.next{display:grid;gap:8px;margin-top:18px}
.next button{padding:13px;border:1px solid var(--line);border-radius:3px;
  background:var(--panel2);font-size:14px;font-weight:600}
.next button:hover{border-color:var(--measure);color:var(--measure)}
.next .prim{background:var(--measure);color:#15181c;border-color:var(--measure)}
.next .prim:hover{color:#15181c;opacity:.9}
.foot{display:flex;gap:14px;justify-content:center;margin-top:26px;
  font-family:var(--mono);font-size:11px;color:var(--faint)}
.foot button:hover{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <span class="name">Vocab Check</span>
    <span class="sub">TOEIC 商務單字 30 天</span>
    <span class="right" id="lib"></span>
  </div>

  <!-- ===== 設定 ===== -->
  <section id="setup">
    <div class="card">
      <h2>1 · 測驗方式</h2>
      <div class="modes">
        <button class="mode" id="mSelf" onclick="setMode('self')">
          <span class="h">自我確認</span>
          <span class="d">看單字自己回想，答案出現後自評對錯。練真實掌握與反應速度。</span>
        </button>
        <button class="mode" id="mMc" onclick="setMode('mc')">
          <span class="h">四選一</span>
          <span class="d">從四個中文選正解，干擾項取自同字群。接近 Part 5 的形式。</span>
        </button>
      </div>
      <div class="hint" id="modeNote" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>2 · 測試範圍</h2>
      <div class="tools">
        <button class="tool" onclick="pickAll(1)">全選</button>
        <button class="tool" onclick="pickAll(0)">清除</button>
        <button class="tool" onclick="pickInvert()">反選</button>
        <button class="tool" onclick="pickWeak()">只選有錯過的天</button>
      </div>
      <div class="days" id="days"></div>
    </div>

    <div class="card">
      <h2>3 · 參數</h2>
      <div class="rows">
        <div class="row">
          <label for="delay" id="delayLab">答案延遲</label>
          <input type="number" id="delay" min="0.1" max="15" step="0.1" value="1.5">
          <input type="range" id="delayR" min="0.1" max="10" step="0.1" value="1.5">
          <span class="hint">秒</span>
        </div>
        <div class="row">
          <label for="count">題數</label>
          <input type="number" id="count" min="1" step="1" value="20">
          <button class="tool" onclick="setCount(20)">20</button>
          <button class="tool" onclick="setCount(50)">50</button>
          <button class="tool" onclick="setCount(0)">全部</button>
          <span class="hint" id="poolInfo"></span>
        </div>
        <label class="chk"><input type="checkbox" id="freshFirst" checked>優先補這個範圍裡還沒測過的字</label>
        <label class="chk"><input type="checkbox" id="weakOnly">只抽這個模式裡答錯過的字（權重 &gt; 1）</label>
      </div>
    </div>

    <button class="go" id="start" onclick="startRound()">開始測試</button>
    <div class="hint" style="text-align:center;margin-top:10px" id="keyHint"></div>
    <div class="foot">
      <button onclick="exportData()">匯出紀錄</button>
      <button onclick="document.getElementById('impf').click()">匯入紀錄</button>
      <input type="file" id="impf" accept=".tsv,.txt" style="display:none" onchange="importData(this)">
      <button onclick="resetData()">重置紀錄</button>
      <span id="saveState"></span>
    </div>
  </section>

  <!-- ===== 測驗 ===== -->
  <section id="test" class="hidden">
    <div class="hud">
      <span class="ct" id="prog">1 / 20</span>
      <span id="tally">✓ 0　✕ 0</span>
      <span class="spark" id="spark"></span>
    </div>

    <div class="stage">
      <div class="word" id="word">—</div>

      <div class="gauge">
        <div class="ticks" id="ticks"></div>
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="readout">
          <span>0</span>
          <span class="val" id="rt">—</span>
          <span id="scaleR">1.5s</span>
        </div>
      </div>

      <!-- 四選一 -->
      <div class="mcgrid hidden" id="mc"></div>

      <!-- 自我確認 -->
      <button class="recall hidden" id="recall" onclick="onRecall()">我想到了</button>

      <div class="ans hidden" id="ans">
        <div class="phline">
          <span class="ph" id="ph"></span>
          <button class="spk" id="spkUS" onclick="say('us')"><span class="lb">美</span> ▶ <span class="k">↑</span></button>
          <button class="spk" id="spkUK" onclick="say('uk')"><span class="lb">英</span> ▶ <span class="k">↓</span></button>
        </div>
        <div class="mean" id="mean"></div>
        <div class="ex"><div class="en" id="ex"></div><div class="zh" id="exz"></div></div>
        <div class="acts hidden" id="selfActs">
          <button class="act ok" onclick="gradeSelf(1)">答對<span class="k">1 / ←</span></button>
          <button class="act ng" onclick="gradeSelf(0)">答錯<span class="k">2 / →</span></button>
        </div>
      </div>
    </div>
    <button class="quit" onclick="quit()">結束本輪</button>
  </section>

  <!-- ===== 結果 ===== -->
  <section id="result" class="hidden">
    <div class="card">
      <h2>本輪成績</h2>
      <div class="score"><span class="big" id="rPct">—</span><span class="pct">%</span></div>
      <div class="hint" id="rLine"></div>
      <div class="stats">
        <span>答對 <b id="rOk">0</b></span>
        <span>答錯 <b id="rNg">0</b></span>
        <span>逾時 <b id="rOv">0</b></span>
        <span>平均反應 <b id="rRt">—</b></span>
      </div>
    </div>
    <div class="card" id="wrongCard">
      <h2>要複習的字</h2>
      <div class="wrongs" id="wrongs"></div>
    </div>
    <div class="next">
      <button class="prim" id="againWrong" onclick="retryWrong()">再測這些錯的字</button>
      <button onclick="startRound()">同設定再抽一輪</button>
      <button onclick="show('setup')">回到設定</button>
    </div>
  </section>
</div>

consciously.mp3","uk_pron/u/ukc/ukcon/ukconsc006.mp3"],[28,1,"consciousness","美 /ˈkɑːn.ʃəs.nəs/　英 /ˈkɒn.ʃəs.nəs/","ⓝ 意識","Cost consciousness grew after the audit.","稽核之後成本意識提高了。","us_pron/c/con/consc/consciousness.mp3","uk_pron/u/ukc/ukcon/ukconsc007.mp3"],[28,1,"curious","美 /ˈkjʊr.i.əs/　英 /ˈkjʊə.ri.əs/","ⓐ 好奇的；奇怪的","A curious pattern appeared in the night data.","夜間數據中出現了一個奇怪的規律。","us_pron/c/cur/curio/curious.mp3","uk_pron/u/ukc/ukcur/ukcurio002.mp3"],[28,1,"effort","美 /ˈef.ɚt/　英 /ˈef.ət/","ⓝ 努力","The effort paid off in the second quarter.","這番努力在第二季有了回報。","us_pron/e/eff/effor/effort.mp3","uk_pron/u/uke/ukeer/ukeeril028.mp3"],[28,1,"expect","/ɪkˈspekt/","ⓥ 預期；期待","We expect delivery before the end of May.","我們預期五月底前交貨。","us_pron/e/exp/expec/expect.mp3","uk_pron/u/uke/ukexp/ukexpat004.mp3"],[28,1,"expectation","/ˌek.spekˈteɪ.ʃən/","ⓝ 期望；預期","The result fell short of expectation.","結果不如預期。","us_pron/e/exp/expec/expectation.mp3","uk_pron/u/uke/ukexp/ukexpat008.mp3"],[28,1,"focus","美 /ˈfoʊ.kəs/　英 /ˈfəʊ.kəs/","ⓥ 聚焦；專注　ⓝ 焦點","Focus the lens before starting the scan.","開始掃描前請先對焦。","us_pron/f/foc/focus/focus.mp3","uk_pron/u/ukf/ukfob/ukfob__004.mp3"],[28,1,"identify","美 /aɪˈden.t̬ə.faɪ/　英 /aɪˈden.tɪ.faɪ/","ⓥ 辨識；確認","The software identifies twelve defect types.","軟體可辨識十二種缺陷類型。","us_pron/i/ide/ident/identify.mp3","uk_pron/u/uki/ukico/ukicono022.mp3"],[28,2,"idle","/ˈaɪ.dəl/","ⓐ 閒置的　ⓥ 空轉","The second line sat idle for a month.","第二條線閒置了一個月。","us_pron/i/idl/idle_/idle.mp3","uk_pron/u/uki/ukidi/ukidioc009.mp3"],[28,2,"ignorance","美 /ˈɪɡ.nɚ.əns/　英 /ˈɪɡ.nər.əns/","ⓝ 無知；不知情","Ignorance of the rule is not an excuse.","不知道規定不能當作藉口。","us_pron/i/ign/ignor/ignorance.mp3","uk_pron/u/uki/ukidi/ukidioc030.mp3"],[28,2,"ignorant","美 /ˈɪɡ.nɚ.ənt/　英 /ˈɪɡ.nər.ənt/","ⓐ 無知的；不知情的","We were ignorant of the change until Friday.","我們直到週五才知道這項變更。","us_pron/i/ign/ignor/ignorant.mp3","uk_pron/u/uki/ukign/ukignor001.mp3"],[28,2,"ignore","/ɪɡˈnɔːr/","ⓥ 忽略","Do not ignore an intermittent alarm.","請勿忽略間歇性的 const POS = /[ⓝⓥⓐⓓⓟⓒ]/g;
const WORDS = DATA.words.map(function(a,i){
  const o = {i:i, d:a[0], g:a[1], w:a[2], p:a[3], m:a[4], e:a[5], z:a[6], au:a[7]||"", ak:a[8]||""};
  o.plain = o.m.replace(POS,"\u00a7").split("\u00a7")
              .map(function(s){ return s.trim(); })
              .filter(function(s){ return s.length>0; }).join("；");
  o.sense = new Set(o.plain.split(/[；;、　\s]+/).filter(function(s){ return s.length>0; }));
  return o;
});
const BYDAY = {}, BYGRP = {};
WORDS.forEach(function(x){
  (BYDAY[x.d] = BYDAY[x.d] || []).push(x);
  const k = x.d + ":" + x.g;
  (BYGRP[k] = BYGRP[k] || []).push(x);
});
const KEY = "toeic:vocabcheck:v2", OLDKEY = "toeic:vocabcheck:v1";
const MINW = 0.125, MAXW = 8;
const ARROWS = ["↑","←","→","↓"];
const AUDIO_BASE = "https://dictionary.cambridge.org/media/english/";
const DEFDELAY = {self:1.5, mc:4.0};

/* 儲存轉接器：Claude artifact 用 window.storage，一般網站用 localStorage */
const DB = (function(){
  const ws = (typeof window !== "undefined") ? window.storage : null;
  if(ws && typeof ws.get === "function"){
    return {kind:"artifact",
      get:function(k){ return ws.get(k).then(function(r){ return r && r.value; }); },
      set:function(k,v){ return ws.set(k,v); }};
  }
  return {kind:"local",
    get:function(k){ return Promise.resolve(localStorage.getItem(k)); },
    set:function(k,v){ localStorage.setItem(k,v); return Promise.resolve(); }};
})();

let prog = {w:{self:{},mc:{}}, s:{self:{},mc:{}}};
let storageOK = true, mode = "self", sel = new Set(), S = null, player = null;

/* ---------- 儲存 ---------- */
function norm(o){
  const p = {w:{self:{},mc:{}}, s:{self:{},mc:{}}};
  if(!o) return p;
  if(o.w && (o.w.self || o.w.mc)){                      // v2
    p.w.self = o.w.self||{}; p.w.mc = o.w.mc||{};
    p.s.self = (o.s&&o.s.self)||{}; p.s.mc = (o.s&&o.s.mc)||{};
  }else if(o.w){                                        // v1 -> 併入自我確認
    p.w.self = o.w||{}; p.s.self = o.s||{};
  }
  return p;
}
async function load(){
  let raw = null;
  try{ const v = await DB.get(KEY); if(v) raw = JSON.parse(v); }catch(e){}
  if(!raw){ try{ const v = await DB.get(OLDKEY); if(v) raw = JSON.parse(v); }catch(e){} }
  prog = norm(raw);
  try{ await DB.set(KEY+":probe","1"); }
  catch(e){ storageOK = false; document.getElementById("saveState").textContent = "紀錄無法儲存，本次結果不會保留"; }
}
let saveTimer = null;
function save(){
  if(!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async function(){
    try{ await DB.set(KEY, JSON.stringify(prog)); }catch(e){ storageOK = false; }
  }, 120);
}
function weight(w){ const t = prog.w[mode][w]; return t === undefined ? 1 : t; }
function bump(w, good){
  const cur = weight(w);
  prog.w[mode][w] = Math.min(MAXW, Math.max(MINW, good ? cur/2 : cur*2));
  const st = prog.s[mode][w] || [0,0];
  st[0] += good ? 1 : 0; st[1] += 1;
  prog.s[mode][w] = st;
  save();
}

/* ---------- 模式 ---------- */
function setMode(m){
  mode = m;
  document.getElementById("mSelf").classList.toggle("on", m === "self");
  document.getElementById("mMc").classList.toggle("on", m === "mc");
  document.getElementById("delayLab").textContent = m === "self" ? "答案延遲" : "作答時限";
  document.getElementById("delay").value = DEFDELAY[m];
  document.getElementById("delayR").value = DEFDELAY[m];
  document.getElementById("modeNote").textContent = m === "self"
    ? "延遲時間內按「我想到了」才算反應內；逾時仍可自評對錯。"
    : "四個選項同時出現，逾時只標記、仍可作答。干擾項會排除與正解共用義項的字。";
  document.getElementById("keyHint").innerHTML = m === "self"
    ? "空白鍵＝我想到了　　1／← 答對　　2／→ 答錯　　解答後 ↑ 美式　↓ 英式"
    : "↑ ← → ↓ ＝選答案　　答完 ↑ 美式　↓ 英式　　空白鍵＝下一題";
  paintDays();
}

/* ---------- 設定畫面 ---------- */
function buildDays(){
  document.getElementById("days").innerHTML = DATA.days.map(function(d){
    return '<button class="day" data-d="'+d.n+'" onclick="toggleDay('+d.n+')">'+
           '<span class="n"><span>Day '+d.n+'</span><span>'+d.c+'</span></span>'+
           '<span class="t">'+d.t+'</span></button>';
  }).join("");
}
function paintDays(){
  document.querySelectorAll(".day").forEach(function(el){
    el.classList.toggle("on", sel.has(+el.dataset.d));
  });
  poolInfo();
}
function toggleDay(n){ sel.has(n) ? sel.delete(n) : sel.add(n); paintDays(); }
function pickAll(on){ sel = on ? new Set(DATA.days.map(function(d){return d.n})) : new Set(); paintDays(); }
function pickInvert(){ const s = new Set(); DATA.days.forEach(function(d){ if(!sel.has(d.n)) s.add(d.n); }); sel = s; paintDays(); }
function pickWeak(){
  const s = new Set();
  WORDS.forEach(function(x){ if(weight(x.w) > 1) s.add(x.d); });
  sel = s; paintDays();
  if(!s.size) document.getElementById("poolInfo").textContent = "這個模式還沒有答錯過的字";
}
function pool(){
  const weak = document.getElementById("weakOnly").checked;
  return WORDS.filter(function(x){ return sel.has(x.d) && (!weak || weight(x.w) > 1); });
}
function poolInfo(){
  const p = pool(), n = p.length;
  let fresh = 0;
  for(let i=0;i<n;i++) if(!prog.s[mode][p[i].w]) fresh++;
  document.getElementById("poolInfo").textContent =
    "可抽 " + n + " 字｜還沒測過 " + fresh + "（0 = 全部）";
  document.getElementById("start").disabled = n === 0;
}
function setCount(n){ document.getElementById("count").value = n; }

/* ---------- 抽題 ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function sample(list, n){
  const p = list.slice(), out = [];
  n = (!n || n > p.length) ? p.length : n;
  for(let k=0;k<n;k++){
    let tot = 0;
    for(let i=0;i<p.length;i++) tot += weight(p[i].w);
    let r = Math.random()*tot, hit = p.length-1;
    for(let i=0;i<p.length;i++){ r -= weight(p[i].w); if(r<=0){ hit=i; break; } }
    out.push(p[hit]); p.splice(hit,1);
  }
  return out;
}
/* 沒測過的字優先填滿本輪，不足的部分才用權重抽 */
function sampleRound(p, n){
  const total = (!n || n > p.length) ? p.length : n;
  if(!document.getElementById("freshFirst").checked) return sample(p, total);
  const unseen = [], seen = [];
  p.forEach(function(x){ (prog.s[mode][x.w] ? seen : unseen).push(x); });
  const take = shuffle(unseen).slice(0, total);
  if(take.length >= total) return take;
  return shuffle(take.concat(sample(seen, total - take.length)));
}
function clash(a,b){
  if(a.i === b.i) return true;
  if(a.plain === b.plain) return true;
  let hit = false;
  a.sense.forEach(function(s){ if(b.sense.has(s)) hit = true; });
  return hit;
}
/* 干擾項：同字群 -> 同一天 -> 全書，一律排除與正解或彼此共用義項的字 */
function options(x){
  const picked = [];
  const okay = function(y){
    if(clash(x,y)) return false;
    for(let i=0;i<picked.length;i++) if(clash(picked[i],y)) return false;
    return true;
  };
  const tiers = [BYGRP[x.d+":"+x.g]||[], BYDAY[x.d]||[], WORDS];
  for(let t=0;t<tiers.length && picked.length<3;t++){
    const c = shuffle(tiers[t].slice());
    for(let i=0;i<c.length && picked.length<3;i++) if(okay(c[i])) picked.push(c[i]);
  }
  return shuffle([x].concat(picked));
}

/* ---------- 一輪 ---------- */
function show(id){
  ["setup","test","result"].forEach(function(s){
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
  if(id === "setup") poolInfo();
  window.scrollTo(0,0);
}
function startRound(list){
  const delay = Math.max(0.1, parseFloat(document.getElementById("delay").value) || DEFDELAY[mode]);
  let q;
  if(Array.isArray(list) && list.length){ q = shuffle(list.slice()); }
  else{
    const p = pool();
    if(!p.length) return;
    q = sampleRound(p, parseInt(document.getElementById("count").value,10) || 0);
  }
  S = {q:q, i:0, delay:delay, mode:mode, ok:0, ng:0, ov:0, rts:[], wrong:[],
       t0:0, shown:false, done:false, raf:0, timer:0, over:false, opts:null};
  buildTicks(delay);
  document.getElementById("spark").innerHTML = "";
  show("test");
  ask();
}
function buildTicks(delay){
  const step = delay <= 1 ? 0.2 : (delay <= 3 ? 0.5 : 1);
  let h = "";
  for(let t=0; t<=delay+1e-9; t+=step) h += '<i style="left:'+(t/delay*100)+'%"></i>';
  document.getElementById("ticks").innerHTML = h;
  document.getElementById("scaleR").textContent = delay.toFixed(1) + "s";
}

function ask(){
  const x = S.q[S.i];
  if(player){ try{ player.pause(); }catch(e){} player = null; }
  document.getElementById("prog").textContent = (S.i+1) + " / " + S.q.length;
  document.getElementById("tally").textContent = "✓ " + S.ok + "　✕ " + S.ng;
  document.getElementById("word").textContent = x.w;
  document.getElementById("ans").classList.add("hidden");
  document.getElementById("selfActs").classList.add("hidden");
  const rt = document.getElementById("rt"); rt.textContent = "—"; rt.className = "val";
  const fill = document.getElementById("fill");
  fill.style.width = "0%"; fill.style.background = "var(--measure)";

  S.shown = false; S.done = false; S.over = false; S.t0 = performance.now();

  const mc = document.getElementById("mc"), rc = document.getElementById("recall");
  if(S.mode === "mc"){
    S.opts = options(x);
    const cls = ["o-top","o-left","o-right","o-bot"];
    mc.innerHTML = S.opts.map(function(o,k){
      return '<button class="opt '+cls[k]+'" data-k="'+k+'" title="'+ARROWS[k]+'" '+
             'data-key="'+ARROWS[k]+'" onclick="answerMc('+k+')">'+o.plain+'</button>';
    }).join("") +
      '<button class="opt onext hidden" id="nextq" title="空白鍵" onclick="nextQ()">下一題</button>';
    mc.classList.remove("hidden"); rc.classList.add("hidden");
  }else{
    mc.classList.add("hidden"); rc.classList.remove("hidden");
  }
  tick();
  S.timer = setTimeout(onTimeout, S.delay*1000);
}
function tick(){
  const el = document.getElementById("fill");
  const p = Math.min(1, (performance.now() - S.t0)/(S.delay*1000));
  el.style.width = (p*100) + "%";
  if(p < 1 && !S.done && !(S.mode === "self" && S.shown)) S.raf = requestAnimationFrame(tick);
}
function onTimeout(){
  if(S.done) return;
  S.over = true;
  document.getElementById("fill").style.background = "var(--fail)";
  const el = document.getElementById("rt"); el.textContent = "逾時"; el.className = "val ov";
  if(S.mode === "self" && !S.shown) reveal(null);      // 自我確認：時間到出答案
}
function stopClock(){ clearTimeout(S.timer); cancelAnimationFrame(S.raf); }

/* ---------- 自我確認 ---------- */
function onRecall(){ if(S.mode === "self" && !S.shown) reveal((performance.now()-S.t0)/1000); }
function reveal(rt){
  S.shown = true; stopClock(); S.cur_rt = rt;
  const el = document.getElementById("rt"), fill = document.getElementById("fill");
  if(rt === null){
    el.textContent = "逾時"; el.className = "val ov";
    fill.style.width = "100%"; fill.style.background = "var(--fail)";
  }else{
    el.textContent = rt.toFixed(2) + "s"; el.className = "val";
    fill.style.width = (Math.min(1, rt/S.delay)*100) + "%";
  }
  paintAnswer();
  document.getElementById("recall").classList.add("hidden");
  document.getElementById("selfActs").classList.remove("hidden");
  document.getElementById("ans").classList.remove("hidden");
}
function gradeSelf(good){
  if(!S.shown || S.done) return;
  S.done = true;
  const x = S.q[S.i];
  bump(x.w, good);
  record(good, S.cur_rt === null, S.cur_rt, null);
  S.i++;
  if(S.i >= S.q.length) finish(); else ask();
}

/* ---------- 四選一 ---------- */
function answerMc(k){
  if(S.done) return;
  S.done = true; stopClock();
  const rt = (performance.now() - S.t0)/1000;
  const x = S.q[S.i], chosen = S.opts[k], good = chosen.i === x.i;
  if(!S.over){
    const el = document.getElementById("rt");
    el.textContent = rt.toFixed(2) + "s"; el.className = "val";
    document.getElementById("fill").style.width = (Math.min(1, rt/S.delay)*100) + "%";
  }
  document.querySelectorAll("#mc .opt[data-k]").forEach(function(el){
    const j = +el.dataset.k;
    el.classList.add("done");
    if(S.opts[j].i === x.i) el.classList.add("right");
    else if(j === k) el.classList.add("wrong");
    else el.classList.add("dim");
  });
  bump(x.w, good ? 1 : 0);
  record(good ? 1 : 0, S.over, S.over ? null : rt, good ? null : chosen.plain);
  paintAnswer();
  document.getElementById("ans").classList.remove("hidden");
  document.getElementById("nextq").classList.remove("hidden");
}
function nextQ(){
  if(!S.done) return;
  S.i++;
  if(S.i >= S.q.length) finish(); else ask();
}

/* ---------- 共用 ---------- */
function record(good, over, rt, pick){
  const x = S.q[S.i];
  if(over) S.ov++;
  if(good){ S.ok++; }
  else{ S.ng++; S.wrong.push({x:x, ov:over, pick:pick}); }
  if(rt !== null && rt !== undefined) S.rts.push(rt);
  const sp = document.getElementById("spark");
  const h = over ? 18 : Math.max(3, Math.round(Math.min(1, (rt||0)/S.delay)*18));
  sp.insertAdjacentHTML("beforeend", '<i class="'+(over?"ov":"")+'" style="height:'+h+'px"></i>');
  if(sp.children.length > 24) sp.removeChild(sp.firstChild);
}
function paintAnswer(){
  const x = S.q[S.i];
  document.getElementById("ph").innerHTML = x.p
    .replace(/美/g,'<span class="reg">美</span>').replace(/英/g,'<span class="reg">英</span>');
  document.getElementById("mean").innerHTML = x.m.replace(POS, function(c){
    return '<span class="pos">'+c+'</span>';
  });
  document.getElementById("ex").textContent = x.e;
  document.getElementById("exz").textContent = x.z;
  const bu = document.getElementById("spkUS"), bk = document.getElementById("spkUK");
  bu.disabled = !x.au; bk.disabled = !x.ak;
  bu.classList.remove("on"); bk.classList.remove("on");
  bu.title = x.au ? "" : "劍橋沒有這個字的美式發音";
  bk.title = x.ak ? "" : "劍橋沒有這個字的英式發音";
}
function say(which){
  if(!S) return;
  const answered = S.mode === "mc" ? S.done : S.shown;
  if(!answered) return;
  const x = S.q[S.i], path = which === "us" ? x.au : x.ak;
  const btn = document.getElementById(which === "us" ? "spkUS" : "spkUK");
  if(!path) return;
  try{
    if(player){ player.pause(); }
    player = new Audio(AUDIO_BASE + path);
    btn.classList.add("on");
    player.addEventListener("ended", function(){ btn.classList.remove("on"); });
    player.addEventListener("error", function(){ btn.classList.remove("on"); btn.disabled = true; });
    player.play().catch(function(){ btn.classList.remove("on"); });
  }catch(e){ btn.classList.remove("on"); }
}
function quit(){
  stopClock();
  if(S.i === 0 && !S.done){ show("setup"); return; }
  S.q = S.q.slice(0, S.i);
  finish();
}
function finish(){
  stopClock();
  if(player){ try{ player.pause(); }catch(e){} player = null; }
  document.getElementById("spark").innerHTML = "";
  const n = S.ok + S.ng;
  const pct = n ? Math.round(S.ok/n*100) : 0;
  document.getElementById("rPct").textContent = pct;
  document.getElementById("rOk").textContent = S.ok;
  document.getElementById("rNg").textContent = S.ng;
  document.getElementById("rOv").textContent = S.ov;
  const avg = S.rts.length ? (S.rts.reduce(function(a,b){return a+b},0)/S.rts.length) : null;
  document.getElementById("rRt").textContent = avg ? avg.toFixed(2)+"s" : "—";

  let line = (S.mode === "mc" ? "四選一" : "自我確認") + "　" + n + " 題，" +
             (S.mode === "mc" ? "作答時限 " : "延遲設定 ") + S.delay.toFixed(1) + " 秒。";
  if(S.mode === "mc") line += " 四選一有 25% 猜中率，數字會比自我確認漂亮，兩種模式的紀錄是分開存的。";
  else if(S.ov) line += " 有 " + S.ov + " 題是逾時後才想出來的——那些字在考場上等於不會。";
  document.getElementById("rLine").textContent = line;

  const wc = document.getElementById("wrongCard");
  if(S.wrong.length){
    wc.classList.remove("hidden");
    document.getElementById("wrongs").innerHTML = S.wrong.map(function(o){
      return '<div class="r"><span class="w">'+o.x.w+'</span><span class="m">'+o.x.m+'</span>'+
             (o.pick?'<span class="pick">你選了：'+o.pick+'</span>':'')+
             (o.ov?'<span class="ov">逾時</span>':'')+'</div>';
    }).join("");
    document.getElementById("againWrong").classList.remove("hidden");
    document.getElementById("againWrong").textContent = "再測這 " + S.wrong.length + " 個錯的字";
  }else{
    wc.classList.add("hidden");
    document.getElementById("againWrong").classList.add("hidden");
  }
  show("result");
}
function retryWrong(){ startRound(S.wrong.map(function(o){return o.x})); }

/* ---------- 紀錄管理 ---------- */
function exportData(){
  const rows = ["mode\tword\tweight\tright\ttotal"];
  ["self","mc"].forEach(function(m){
    Object.keys(prog.s[m]).forEach(function(w){
      const wt = prog.w[m][w] === undefined ? 1 : prog.w[m][w];
      rows.push(m+"\t"+w+"\t"+wt+"\t"+prog.s[m][w][0]+"\t"+prog.s[m][w][1]);
    });
  });
  const b = new Blob([rows.join("\n")], {type:"text/tab-separated-values"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "vocabcheck_progress.tsv"; a.click();
}
function importData(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = function(){
    let n = 0;
    String(rd.result).split(/\r?\n/).forEach(function(line){
      const a = line.split("\t");
      if(a.length < 5 || (a[0] !== "self" && a[0] !== "mc")) return;
      const m = a[0], w = a[1], wt = parseFloat(a[2]), ok = parseInt(a[3],10), tot = parseInt(a[4],10);
      if(!w || isNaN(wt) || isNaN(ok) || isNaN(tot)) return;
      prog.w[m][w] = Math.min(MAXW, Math.max(MINW, wt));
      prog.s[m][w] = [ok, tot];
      n++;
    });
    save(); paintDays();
    document.getElementById("saveState").textContent = "已匯入 " + n + " 筆";
    setTimeout(function(){ document.getElementById("saveState").textContent=""; }, 3000);
  };
  rd.readAsText(f);
  input.value = "";
}
async function resetData(){
  if(!confirm("清空兩種模式的所有權重與答題紀錄？這無法復原。")) return;
  prog = {w:{self:{},mc:{}}, s:{self:{},mc:{}}};
  try{ await DB.set(KEY, JSON.stringify(prog)); }catch(e){}
  paintDays();
  document.getElementById("saveState").textContent = "紀錄已清空";
  setTimeout(function(){ document.getElementById("saveState").textContent=""; }, 2500);
}

/* ---------- 鍵盤 ---------- */
document.addEventListener("keydown", function(e){
  if(document.getElementById("test").classList.contains("hidden")) return;
  const k = e.key;
  const answered = S && (S.mode === "mc" ? S.done : S.shown);

  if(S && S.mode === "mc" && !S.done){
    const idx = {"ArrowUp":0, "ArrowLeft":1, "ArrowRight":2, "ArrowDown":3}[k];
    if(idx !== undefined){ e.preventDefault(); answerMc(idx); }
    return;
  }
  if(k === "ArrowUp" && answered){ e.preventDefault(); say("us"); return; }
  if(k === "ArrowDown" && answered){ e.preventDefault(); say("uk"); return; }
  if(k === " " || k === "Enter"){
    e.preventDefault();
    if(S && S.mode === "mc"){ if(S.done) nextQ(); }
    else if(S && !S.shown) onRecall();
    return;
  }
  if(S && S.mode === "self" && S.shown && !S.done){
    if(k === "1" || k === "ArrowLeft"){ e.preventDefault(); gradeSelf(1); }
    if(k === "2" || k === "ArrowRight"){ e.preventDefault(); gradeSelf(0); }
  }
});

/* ---------- 啟動 ---------- */
(function(){
  const d = document.getElementById("delay"), r = document.getElementById("delayR");
  d.addEventListener("input", function(){ r.value = d.value; });
  r.addEventListener("input", function(){ d.value = r.value; });
  document.getElementById("weakOnly").addEventListener("change", poolInfo);
  document.getElementById("freshFirst").addEventListener("change", poolInfo);
  document.getElementById("lib").textContent = WORDS.length + " 字";
  buildDays();
  sel = new Set([1]);
  setMode("self");
  load().then(paintDays);
})();
</script>
